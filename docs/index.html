<style>

.badge.diamond { background: #1e9be0; } .badge.platinum { background: #78909c; } .badge.gold { background: #d4a017; } .badge.silver { background: #9e9e9e; } .badge.bronze { background: #a5602c; } .badge.clear { background: #757575; }

/* ---------- screens ---------- */
.screen { display: none; }
.screen.show { display: flex; }
#home { flex-direction: column; overflow-y: auto; height: 100%; }

.chip { position: relative; font-size: 13px; padding: 5px 10px; border-radius: 6px; border: 1px solid #999; background: #fafafa; cursor: pointer; min-width: 48px; text-align: center; }
.chip:hover { background: #fff; border-color: #555; }
.chip.diamond { background: #e1f5fe; border-color: #1e9be0; }
.chip.platinum { background: #eceff1; border-color: #78909c; }
.chip.gold { background: #fff3c4; border-color: #d4a017; }
.chip.silver { background: #f5f5f5; border-color: #9e9e9e; }
.chip.bronze { background: #f5e6d8; border-color: #a5602c; }
.chip.clear { background: #f0f0f0; border-color: #bdbdbd; }
.chip .rk { display: block; font-size: 9px; font-weight: 700; letter-spacing: 0.05em; }
.chip.diamond .rk { color: #1e9be0; } .chip.platinum .rk { color: #607d8b; } .chip.gold .rk { color: #b8860b; } .chip.silver .rk { color: #757575; } .chip.bronze .rk { color: #8a4f22; } .chip.clear .rk { color: #757575; }
.chip .sc { display: block; font-size: 10px; color: #555; }
/* difficulty / rating の色 (AtCoder と同じ) */
.rt-gray { --rc: #808080; } .rt-brown { --rc: #804000; } .rt-green { --rc: #008000; } .rt-cyan { --rc: #00c0c0; }
.rt-blue { --rc: #0000ff; } .rt-yellow { --rc: #c0c000; } .rt-orange { --rc: #ff8000; } .rt-red { --rc: #ff0000; }
.diffnum, .account .who[class*="rt-"], td[class*="rt-"], .account .rating-open[class*="rt-"] { color: var(--rc); }
#game header .account .who[class*="rt-"] { filter: brightness(1.6); }   /* 暗いヘッダーでも読めるように */
/* AtCoder Problems 風の丸: 帯の中での進み具合 (--p) を下から塗る */
.diff { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--rc); box-sizing: border-box; margin-right: 4px; vertical-align: -1px;
  background: linear-gradient(to top, var(--rc) var(--p, 0%), transparent var(--p, 0%)); }
#stage-title .diff { width: 14px; height: 14px; border-width: 2px; vertical-align: 0; margin-right: 3px; }
.diffnum { font-size: 14px; font-weight: 700; }
.account .rating-open { font-weight: 700; border-color: var(--rc, #999); }
.account .rating-open.unrated { color: #777; font-weight: 400; }

#maker-body label.mfield { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: #555; }

#maker-body input[type="text"] { font-size: 14px; padding: 5px 8px; border: 1px solid #999; border-radius: 6px; }
#maker-canvas, #mstage-canvas { border: 1px solid #cfcac0; border-radius: 6px; background: #f4f1ea; cursor: crosshair; touch-action: none; max-width: 100%; }
.maker-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.maker-item { border: 1px solid #ddd8cf; border-radius: 8px; padding: 8px 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: #fcfbf8; }

.maker-msg.good { color: #2e7d32; }
.maker-note { font-size: 12px; color: #777; line-height: 1.6; margin-top: 6px; }
.mode-btns button.on { background: #3b3a37; color: #fff; border-color: #3b3a37; }
#custom-cards .stage-card .byline { font-size: 11px; color: #888; }
.unrated-tag { display: inline-block; font-size: 10px; font-weight: 700; color: #8a6d3b; background: #f5ead2; border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }

/* ---------- ranking / share ---------- */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 30; align-items: center; justify-content: center; }
.overlay.show { display: flex; }
#ranking .box { max-width: 1000px; }
.overlay .box { background: #fff; border-radius: 12px; padding: 18px 22px; max-width: 820px; width: calc(100% - 24px); max-height: 90vh; overflow-y: auto; font-size: 14px; }
.lb-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-top: 10px; }
.lb-col { min-width: 0; overflow-x: auto; }
/* 名前を折り返さない (総合部門は列が 1 つ多いため). 入りきらない列は横スクロールする */
.lb th, .lb td { white-space: nowrap; }

.lb-form { display: flex; gap: 6px; justify-content: center; align-items: center; margin: 10px 0 4px; flex-wrap: wrap; }
.lb-form input { font-size: 14px; padding: 5px 8px; border: 1px solid #999; border-radius: 6px; width: 160px; }
.lb-msg { font-size: 13px; margin: 4px 0; min-height: 18px; }
.lb-msg.err { color: #d32f2f; }
.result .row { justify-content: center; margin-top: 10px; }
.result .note { font-size: 11px; color: #777; margin-top: 6px; }
.champ { font-size: 12px; color: #555; margin-top: 6px; line-height: 1.5; }

/* ---- ホームのお知らせ ---- */

<body>
<noscript><p style="padding:20px">This game requires JavaScript. / このゲームには JavaScript が必要です。</p></noscript>

<!-- ================= home ================= -->
<div id="home" class="screen show">
  <div class="home-inner">
    <div class="topbar">
      <span id="home-account" class="account"></span>
      <button id="home-rating" data-i18n="rating.btn"></button>
      <button id="home-lang" class="lang">EN</button>
    </div>
    <div class="hero">

<script>
/*
 * lns2.js — 標準 MAPF 用 LNS2 (停止 + 上下左右, 頂点衝突 / 辺(スワップ)衝突)
 *
 * HirokiNagai-39/mawpf の LNS2 (algorithms/src/lns2.cpp) を JS に移植し,
 * 回転・加速・フォロワー衝突を取り除いて通常の MAPF 設定に戻したもの.
 *   1. ソフト制約 PP (衝突にペナルティを付けた時空間 A*) で初期解を作る
 *   2. 衝突しているエージェント集合から近傍 B をランダムに選ぶ
 *   3. B を (他エージェントを固定して) 順に再計画し, 衝突数が減れば採用
 *   4. 衝突 0 になったら終了
 *
 * Node (module.exports) とブラウザ / Web Worker (グローバル LNS2) の両方で動く.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.LNS2 = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ---------------------------------------------------------------- PRNG
  function makeRng(seed) {
    let a = (seed >>> 0) || 0x9e3779b9;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function randInt(rng, lo, hi) { return lo + Math.floor(rng() * (hi - lo + 1)); }
  function shuffle(arr, rng) {
    for (let i = arr.length - 1; i > 0; --i) {
      const j = Math.floor(rng() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  // ---------------------------------------------------------------- maps
  // MovingAI 形式 (.map) のパース. '.' と 'G' を通行可能とする.
  function parseMap(text) {
    const lines = text.replace(/\r/g, '').split('\n');
    let w = 0, h = 0, i = 0;
    for (; i < lines.length; ++i) {
      const L = lines[i].trim(); let m;
      if ((m = /^height\s+(\d+)/.exec(L))) h = +m[1];
      else if ((m = /^width\s+(\d+)/.exec(L))) w = +m[1];
      else if (/^map$/.test(L)) { ++i; break; }
    }
    const free = new Uint8Array(w * h);
    for (let y = 0; y < h; ++y) {
      const row = lines[i + y] || '';
      for (let x = 0; x < w; ++x) {
        const ch = row[x];
        free[y * w + x] = (ch === '.' || ch === 'G') ? 1 : 0;
      }
    }
    return { w, h, free };
  }

  function makeEmptyMap(w, h) {
    return { w, h, free: new Uint8Array(w * h).fill(1) };
  }

  function makeRandomMap(w, h, density, seed) {
    const rng = makeRng(seed);
    const free = new Uint8Array(w * h);
    for (let c = 0; c < w * h; ++c) free[c] = rng() < density ? 0 : 1;
    return { w, h, free };
  }

  // ---------------------------------------------------------------- graph
  // nbr[c*5 .. c*5+nbrCnt[c]) : 先頭は自分自身 (停止), 以降は隣接セル
  function buildGraph(map) {
    const { w, h, free } = map; const V = w * h;
    const nbr = new Int32Array(V * 5); const nbrCnt = new Uint8Array(V);
    for (let c = 0; c < V; ++c) {
      if (!free[c]) continue;
      let k = 0; const b = c * 5; const x = c % w, y = (c / w) | 0;
      nbr[b + k++] = c;
      if (x > 0 && free[c - 1]) nbr[b + k++] = c - 1;
      if (x < w - 1 && free[c + 1]) nbr[b + k++] = c + 1;
      if (y > 0 && free[c - w]) nbr[b + k++] = c - w;
      if (y < h - 1 && free[c + w]) nbr[b + k++] = c + w;
      nbrCnt[c] = k;
    }
    return { w, h, free, V, nbr, nbrCnt };
  }

  function bfsDist(G, src) {
    const d = new Int32Array(G.V).fill(-1);
    const q = new Int32Array(G.V); let qh = 0, qt = 0;
    d[src] = 0; q[qt++] = src;
    while (qh < qt) {
      const c = q[qh++]; const b = c * 5, n = G.nbrCnt[c];
      for (let k = 1; k < n; ++k) { const u = G.nbr[b + k]; if (d[u] < 0) { d[u] = d[c] + 1; q[qt++] = u; } }
    }
    return d;
  }

  // 連結成分ラベル付け. 最大成分のセル配列を返す
  function largestComponent(G) {
    const label = new Int32Array(G.V).fill(-1);
    let best = [], id = 0;
    const q = new Int32Array(G.V);
    for (let s = 0; s < G.V; ++s) {
      if (!G.free[s] || label[s] >= 0) continue;
      let qh = 0, qt = 0; q[qt++] = s; label[s] = id; const cells = [];
      while (qh < qt) {
        const c = q[qh++]; cells.push(c); const b = c * 5, n = G.nbrCnt[c];
        for (let k = 1; k < n; ++k) { const u = G.nbr[b + k]; if (label[u] < 0) { label[u] = id; q[qt++] = u; } }
      }
      if (cells.length > best.length) best = cells;
      ++id;
    }
    return best;
  }

  // ランダムインスタンス生成 (最大連結成分から start / goal をそれぞれ重複なく抽出)
  function generateInstance(G, N, seed) {
    const cells = largestComponent(G);
    if (cells.length < N) throw new Error('map too small for ' + N + ' agents');
    const rng = makeRng(seed * 7919 + 17);
    const starts = shuffle(cells.slice(), rng).slice(0, N);
    const goals = shuffle(cells.slice(), rng).slice(0, N);
    return { starts, goals };
  }

  // ---------------------------------------------------------------- metrics
  function posAt(path, t) { return t < path.length ? path[t] : path[path.length - 1]; }
  // 末尾の (ゴールでの) 待機を取り除く
  function trimPath(path) {
    let e = path.length - 1;
    while (e > 0 && path[e] === path[e - 1]) --e;
    return e === path.length - 1 ? path : path.slice(0, e + 1);
  }
  function pathMoves(path) {
    let m = 0;
    for (let t = 1; t < path.length; ++t) if (path[t] !== path[t - 1]) ++m;
    return m;
  }
  function metrics(paths) {
    let makespan = 0, moves = 0, sumOfCosts = 0;
    for (const p of paths) {
      const tp = trimPath(p);
      makespan = Math.max(makespan, tp.length - 1);
      sumOfCosts += tp.length - 1;
      moves += pathMoves(tp);
    }
    return { makespan, moves, sumOfCosts };
  }

  // 衝突検出. 頂点衝突 (同時刻同セル) と辺衝突 (スワップ) を数える.
  // 経路の終端以降はその場に留まるとみなす.
  // 返り値: { count, conf: Uint8Array(N), list: [{t,type,a,b,cell,cell2}] (collect 時) }
  function findCollisions(paths, V, collect) {
    const N = paths.length;
    let T = 0;
    for (let i = 0; i < N; ++i) T = Math.max(T, paths[i].length - 1);
    const conf = new Uint8Array(N);
    const list = collect ? [] : null;
    let count = 0;
    let stampA = new Int32Array(V).fill(-1), agentA = new Int32Array(V);
    let stampB = new Int32Array(V).fill(-1), agentB = new Int32Array(V);
    const cur = new Int32Array(N), prev = new Int32Array(N);
    for (let t = 0; t <= T; ++t) {
      // swap buffers: A = time t, B = time t-1
      const ts = stampA; stampA = stampB; stampB = ts;
      const ta = agentA; agentA = agentB; agentB = ta;
      for (let i = 0; i < N; ++i) {
        prev[i] = cur[i];
        const c = cur[i] = posAt(paths[i], t);
        if (stampA[c] === t) {
          ++count; conf[i] = 1; conf[agentA[c]] = 1;
          if (list) list.push({ t, type: 'vertex', a: agentA[c], b: i, cell: c, cell2: c });
        } else { stampA[c] = t; agentA[c] = i; }
      }
      if (t === 0) continue;
      for (let i = 0; i < N; ++i) {
        const p = prev[i], c = cur[i];
        if (p === c) continue;
        if (stampB[c] !== t - 1) continue;
        const j = agentB[c];
        if (j === i || j < i) continue; // 同一ペアの二重計上を防ぐ (i<j のときのみ記録)
        if (cur[j] === p && prev[j] === c) {
          ++count; conf[i] = 1; conf[j] = 1;
          if (list) list.push({ t, type: 'edge', a: i, b: j, cell: p, cell2: c });
        }
      }
    }
    return { count, conf, list };
  }

  // ---------------------------------------------------------------- heap
  function Heap() { this.f = []; this.g = []; this.k = []; }
  Heap.prototype.size = function () { return this.f.length; };
  Heap.prototype.less = function (i, j) {
    return this.f[i] !== this.f[j] ? this.f[i] < this.f[j] : this.g[i] > this.g[j]; // f 小 → g 大 (深い方) 優先
  };
  Heap.prototype.swap = function (i, j) {
    let t = this.f[i]; this.f[i] = this.f[j]; this.f[j] = t;
    t = this.g[i]; this.g[i] = this.g[j]; this.g[j] = t;
    t = this.k[i]; this.k[i] = this.k[j]; this.k[j] = t;
  };
  Heap.prototype.push = function (f, g, k) {
    this.f.push(f); this.g.push(g); this.k.push(k);
    let i = this.f.length - 1;
    while (i > 0) { const p = (i - 1) >> 1; if (this.less(i, p)) { this.swap(i, p); i = p; } else break; }
  };
  Heap.prototype.pop = function () {
    const n = this.f.length - 1;
    this.swap(0, n);
    const r = { f: this.f.pop(), g: this.g.pop(), k: this.k.pop() };
    let i = 0;
    for (;;) {
      const l = 2 * i + 1, rr = l + 1; let m = i;
      if (l < n && this.less(l, m)) m = l;
      if (rr < n && this.less(rr, m)) m = rr;
      if (m === i) break;
      this.swap(i, m); i = m;
    }
    return r;
  };

  // ---------------------------------------------------------------- solver
  function Solver(G, starts, goals, seed, opts) {
    opts = opts || {};
    this.G = G; this.V = G.V;
    this.N = starts.length;
    this.starts = starts; this.goals = goals;
    this.rng = makeRng(seed);
    this.dist = new Array(this.N);
    for (let i = 0; i < this.N; ++i) this.dist[i] = bfsDist(G, goals[i]);
    const N = this.N;
    this.neighborhoodMin = Math.max(2, Math.floor(N / 20));
    this.neighborhoodMax = Math.min(N, Math.max(5, Math.floor(N / 5)));
    this.maxRepairTries = opts.maxRepairTries || 16;
    this.horizonSlack = opts.horizonSlack || 200;
    this.maxExpand = opts.maxExpand || 400000; // A* 1 回あたりの展開上限
    this.wInit = opts.collisionWeightInit || 10;
    this.wRepair = opts.collisionWeightRepair || 1000;
    let mx = 0;
    for (let i = 0; i < N; ++i) mx = Math.max(mx, this.dist[i][starts[i]]);
    this.horizon = mx + Math.max(this.horizonSlack, mx);
    this.lowerBound = { makespan: mx, moves: 0 };
    for (let i = 0; i < N; ++i) this.lowerBound.moves += Math.max(0, this.dist[i][starts[i]]);
    this.clearOcc();
  }

  Solver.prototype.clearOcc = function () {
    this.occ = [];                                  // occ[t] : Map(cell -> agent)
    this.goalAgent = new Int32Array(this.V).fill(-1); // ゴールに留まるエージェント
    this.goalTime = new Int32Array(this.N);           // ゴール到達時刻
    this.cellTimes = new Array(this.V);               // cell -> [t,...] (経路上の占有時刻)
  };

  Solver.prototype.occAt = function (t, cell) {
    if (t < this.occ.length) { const a = this.occ[t].get(cell); if (a !== undefined) return a; }
    const ga = this.goalAgent[cell];
    if (ga !== -1 && this.goalTime[ga] <= t) return ga;
    return -1;
  };

  // 時刻 nt に v -> u と動くときの衝突数 (頂点 + スワップ)
  Solver.prototype.collisionCount = function (nt, v, u) {
    let c = 0;
    if (this.occAt(nt, u) !== -1) ++c;
    if (u !== v) {
      const b = this.occAt(nt - 1, u);
      if (b !== -1 && this.occAt(nt, v) === b) ++c;
    }
    return c;
  };

  // ゴール g に時刻 t で到着したとき, それ以降に他者が g を通る回数
  Solver.prototype.futureOcc = function (g, t) {
    let k = 0;
    const ts = this.cellTimes[g];
    if (ts) for (let i = 0; i < ts.length; ++i) if (ts[i] > t) ++k;
    const ga = this.goalAgent[g];
    if (ga !== -1) k += 1000; // 別エージェントのゴールと一致 (通常起こらない)
    return k;
  };

  Solver.prototype.reserve = function (agent, path) {
    for (let t = 0; t < path.length; ++t) {
      while (this.occ.length <= t) this.occ.push(new Map());
      const c = path[t];
      this.occ[t].set(c, agent);
      (this.cellTimes[c] || (this.cellTimes[c] = [])).push(t);
    }
    const g = path[path.length - 1];
    this.goalAgent[g] = agent;
    this.goalTime[agent] = path.length - 1;
  };

  // 時空間 A* (衝突にペナルティ). hard=true なら衝突する遷移を禁止.
  Solver.prototype.astar = function (agent, wCol, hard, deadline) {
    const V = this.V, G = this.G, D = this.dist[agent];
    const s = this.starts[agent], g = this.goals[agent];
    if (D[s] < 0) return null;
    const open = new Heap();
    const gbest = new Map(), parent = new Map();
    const sk = s; // key = t*V + cell
    open.push(D[s], 0, sk); gbest.set(sk, 0); parent.set(sk, -1);
    let best = Infinity, bestKey = -1, iter = 0;
    const horizon = this.horizon, maxExpand = this.maxExpand;
    while (open.size() > 0) {
      if ((++iter & 255) === 0 && deadline && Date.now() > deadline) return null;
      if (iter > maxExpand) return null;
      const cur = open.pop();
      if (gbest.get(cur.k) !== cur.g) continue;
      if (cur.f >= best) break;
      const t = Math.floor(cur.k / V), v = cur.k - t * V;

    const o = this.out;
    o.str('GIF89a');
    o.short(w); o.short(h);
    o.byte(0xF7); o.byte(0); o.byte(0);            // global color table 256 entries, 8 bit
    for (let i = 0; i < 256; ++i) {
      const c = palette[i] || [0, 0, 0];
      o.byte(c[0]); o.byte(c[1]); o.byte(c[2]);
    }
    o.byte(0x21); o.byte(0xFF); o.byte(11); o.str('NETSCAPE2.0'); o.byte(3); o.byte(1); o.short(0); o.byte(0); // loop forever
  }
  // indices: Uint8Array(w*h), 255 = 透明 (前フレームの画素を維持)
  Encoder.prototype.addFrame = function (indices, delayCs) {
    const o = this.out;
    o.byte(0x21); o.byte(0xF9); o.byte(4);
    o.byte((1 << 2) | 1);                            // disposal = 1 (残す), transparent flag
    o.short(Math.max(2, Math.round(delayCs)));
    o.byte(TRANSPARENT); o.byte(0);
    o.byte(0x2C); o.short(0); o.short(0); o.short(this.w); o.short(this.h); o.byte(0);
    lzwEncode(indices, 8, o);
    this.frames++;
  };
  Encoder.prototype.finish = function () { this.out.byte(0x3B); return this.out.result(); };

  // ---------------------------------------------------------------- quantizer
  // 5bit/ch のバケットで出現頻度上位 255 色を採用. map() で最近傍にマッピング (キャッシュ付き)
  function Quantizer() { this.count = new Map(); }
  Quantizer.prototype.sample = function (data, step) {
    step = step || 1;
    const cnt = this.count;
    for (let i = 0; i < data.length; i += 4 * step) {
      const key = ((data[i] >> 3) << 10) | ((data[i + 1] >> 3) << 5) | (data[i + 2] >> 3);
      const e = cnt.get(key);
      if (e) { e[0]++; e[1] += data[i]; e[2] += data[i + 1]; e[3] += data[i + 2]; }
      else cnt.set(key, [1, data[i], data[i + 1], data[i + 2]]);
    }
  };
  Quantizer.prototype.build = function () {
    const arr = [...this.count.values()].sort((a, b) => b[0] - a[0]).slice(0, 255);
    this.palette = arr.map(e => [Math.round(e[1] / e[0]), Math.round(e[2] / e[0]), Math.round(e[3] / e[0])]);
    while (this.palette.length < 255) this.palette.push([0, 0, 0]);
    this.palette.push([0, 0, 0]); // 255: transparent slot
    this.cache = new Map();
    return this.palette;
  };
  Quantizer.prototype.index = function (r, g, b) {
    const key = (r << 16) | (g << 8) | b;
    let idx = this.cache.get(key);
    if (idx !== undefined) return idx;
    let best = 0, bd = Infinity; const P = this.palette;
    for (let i = 0; i < 255; ++i) {
      const dr = P[i][0] - r, dg = P[i][1] - g, db = P[i][2] - b;
      const d = dr * dr + dg * dg + db * db;
      if (d < bd) { bd = d; best = i; if (d === 0) break; }
    }
    this.cache.set(key, best);
    return best;
  };
  // RGBA → インデックス. prev (前フレームのインデックス) を渡すと同一画素を透明にする. cur は書き込み先 (再利用可)
  Quantizer.prototype.map = function (data, prev, cur) {
    const n = data.length >> 2;
    const full = cur || new Uint8Array(n);
    const diff = prev ? new Uint8Array(n) : null;
    for (let p = 0, i = 0; p < n; ++p, i += 4) {
      const idx = this.index(data[i], data[i + 1], data[i + 2]);
      if (diff) diff[p] = (idx === prev[p]) ? TRANSPARENT : idx;
      full[p] = idx;
    }
    return { full, frame: diff || full };
  };

  return { Encoder, Quantizer, lzwEncode, TRANSPARENT };
});

<script>
/*
 * leaderboard.js — オンラインランキングのクライアント (バックエンド: server/leaderboard.gs = Google Apps Script)
 *   LB.configured()                 バックエンド URL が設定されているか (src/config.js)
 *   LB.top(stage)     → { makespan: [...], moves: [...], total: [...] }  各部門の上位 (同名はその部門の自己ベストのみ)
 *                       部門は 3 つ: makespan / total distance / 総合 (makespan × distance の積が小さいほど上位)
 *   LB.all()          → { stage: { makespan: entry, moves: entry } }  各ステージ・各部門の 1 位
 *   LB.checkName(name)→ { name, available, taken, legacy, submissions } 登録前の名前チェック
 *   LB.register(name, password) → { name, token, legacy, claimed }    新規登録 (既存名は先着 claim)
 *   LB.login(name, password)    → { name, token, submissions }        ログイン
 *   LB.submit(stage, name, token, paths) → { ok, score, makespan:{...}, moves:{...} }
 *   entry = { name, makespan, moves, ts }
 * 部門の順序: makespan 部門 = makespan 昇順 → 総移動距離 昇順 → 登録時刻昇順 / 総移動距離部門はその逆
 * 投稿にはログインが必須. 記録される名前はサーバーがトークンから引くので, 名前を騙ることはできない.
 */
(function (root) {
  'use strict';
  const TIMEOUT_MS = 20000;
  // 登録・ログインはサーバー側でパスワードのハッシュ計算が入るぶん時間がかかる
  const AUTH_TIMEOUT_MS = 60000;

  function url() { return (root.CONFIG && root.CONFIG.leaderboardUrl || '').trim(); }
  function sanitizeName(s) {
    s = String(s || '').replace(/[\u0000-\u001f<>]/g, '').replace(/\s+/g, ' ').trim();
    return s.slice(0, 16);
  }
  // サーバーの nameKey_ と同じ規則. 同一性の判定にだけ使う (表示は元の文字列)
  function nameKey(s) { return sanitizeName(s).normalize('NFKC').replace(/\s+/g, '').toLowerCase(); }
  const cmpMakespan = (a, b) => a.makespan - b.makespan || a.moves - b.moves || (a.ts || 0) - (b.ts || 0);
  const cmpMoves = (a, b) => a.moves - b.moves || a.makespan - b.makespan || (a.ts || 0) - (b.ts || 0);
  // 総合部門: makespan × total distance の積が小さいほど上位
  const totalScore = e => e.makespan * e.moves;
  const cmpTotal = (a, b) => totalScore(a) - totalScore(b) || a.makespan - b.makespan || (a.ts || 0) - (b.ts || 0);

  // GAS はまれに一時エラー (429/500 や HTML のエラーページ) を返すので, GET だけ少し待って再試行する.
  // POST (登録・ログイン・投稿) は二重実行になり得るため再試行しない.
  // サーバーが ok:false を返したもの (e.detail あり) は何度送っても同じなので再試行しない.
  const RETRY_DELAYS_MS = [1000, 3000];
  async function request(method, params, body, timeoutMs) {
    if (!url()) throw new Error('not configured');
    for (let attempt = 0; ; ++attempt) {
      try { return await requestOnce(method, params, body, timeoutMs); }
      catch (e) {
        if (method !== 'GET' || (e && e.detail) || attempt >= RETRY_DELAYS_MS.length) throw e;
        await new Promise(r => setTimeout(r, RETRY_DELAYS_MS[attempt]));
      }
    }
  }

  async function requestOnce(method, params, body, timeoutMs) {
    const base = url(); if (!base) throw new Error('not configured');
    const q = Object.entries(params || {}).map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join('&');
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = ctrl && setTimeout(() => ctrl.abort(), timeoutMs || TIMEOUT_MS);
    try {
      const res = await fetch(base + (q ? (base.includes('?') ? '&' : '?') + q : ''), {
        method, body: body ? JSON.stringify(body) : undefined, redirect: 'follow', signal: ctrl && ctrl.signal,
        // text/plain にして CORS プリフライトを避ける (GAS ウェブアプリは OPTIONS に応答しない)
        headers: body ? { 'Content-Type': 'text/plain;charset=utf-8' } : undefined,
      });
      const j = await res.json();
      if (!j || j.ok === false) { const e = new Error((j && j.error) || 'server error'); e.detail = j; throw e; }
      return j;
    } catch (e) {
      // 打ち切ったときのブラウザ既定のメッセージは意味が分からないので、判別できる印を付ける
      if (e && (e.name === 'AbortError' || /aborted/i.test(String(e.message)))) { const t = new Error('timeout'); t.timeout = true; throw t; }
      throw e;
    } finally { if (timer) clearTimeout(timer); }
  }

  root.LB = {
    configured: () => !!url(),
    sanitizeName, nameKey, cmpMakespan, cmpMoves, cmpTotal, totalScore,
    async top(stage) {
      const j = await request('GET', { stage });
      return {
        makespan: (j.makespan || []).sort(cmpMakespan),
        moves: (j.moves || []).sort(cmpMoves),
        total: (j.total || []).sort(cmpTotal),
      };
    },
    async all() { const j = await request('GET', { all: 1 }); return j.best || {}; },
    // レーティングと難易度 (サーバーで全投稿から再計算した値). players は rating 降順, stages[stage] = { d, d0, par, players }
    async ratings() { const j = await request('GET', { ratings: 1 }); return { updated: j.updated || 0, players: j.players || [], stages: j.stages || {} }; },
    async checkName(name) { return request('GET', { checkname: sanitizeName(name) }); },
    async register(name, password) { return request('POST', {}, { action: 'register', name: sanitizeName(name), password }, AUTH_TIMEOUT_MS); },
    async login(name, password) { return request('POST', {}, { action: 'login', name: sanitizeName(name), password }, AUTH_TIMEOUT_MS); },
    async submit(stage, name, token, paths) { return request('POST', {}, { action: 'submit', stage, name, token, paths, v: 2 }); },
    // ステージメーカー: 投稿 (kind: 'public' | 'writer') / 公開マップ一覧 / 管理者の受信箱
    async publish(name, token, kind, map) { return request('POST', {}, { action: 'publish', name, token, kind, map }); },
    async customList() { const j = await request('GET', { custom: 1 }); return j.maps || []; },
    async inbox(name, token) { const j = await request('GET', { inbox: 1, name, token }); return j.maps || []; },
  };
})(typeof self !== 'undefined' ? self : this);

</script>

  };
  let LANG = 'ja';
  try { LANG = localStorage.getItem('human_mapf_lang') || ((navigator.language || 'ja').toLowerCase().startsWith('ja') ? 'ja' : 'en'); } catch (e) { }
  if (LANG !== 'ja' && LANG !== 'en') LANG = 'ja';
  function t(k) {

  // ============================================================ sound
  const Sound = {
    ctx: null, enabled: true,
    ensure() {
      if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    },
    tone(freq, dur, type, gain, when, slideTo) {
      if (!this.enabled) return; const c = this.ensure(); if (!c) return;
      const t0 = c.currentTime + (when || 0);
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain || 0.15, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.02);
    },
    step() { this.tone(660, 0.05, 'square', 0.05); },
    wait() { this.tone(330, 0.07, 'triangle', 0.08); },
    undo() { this.tone(440, 0.08, 'sine', 0.08, 0, 220); },
    select() { this.tone(880, 0.04, 'sine', 0.06); },
    goal() { this.tone(880, 0.12, 'sine', 0.12, 0, 1760); },
    tick() { this.tone(1200, 0.02, 'square', 0.02); },
    error() { this.tone(140, 0.35, 'sawtooth', 0.15, 0, 90); this.tone(110, 0.35, 'square', 0.08, 0.05, 70); },
    fanfare() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.14, i * 0.12)); this.tone(1319, 0.5, 'triangle', 0.14, 0.5); },
    gold() { this.fanfare(); [1047, 1319, 1568, 2093].forEach((f, i) => this.tone(f, 0.3, 'sine', 0.1, 0.9 + i * 0.1)); },
  };

  // ============================================================ state
  const S = {
    mapId: 'tutorial', N: 2, seed: 0,
    map: null, G: null, starts: [], goals: [], paths: [], dist: [],
    sel: -1, drag: null, hover: -1,
    undo: [], redo: [],
    ref: null, refState: 'none', solver: null, refPaths: null, lb: null,
    mode: 'edit', anim: null, speed: 3,
    collisions: null, metrics: null, best: null,
    cell: 32, ox: 0, oy: 0,
    lanes: null, // Map(edgeKey -> [agent ids])
    lastResult: null, gifBusy: false, champs: null, champsAt: 0, champsErr: false, ratings: null, ratingsAt: 0, custom: null, customList: null, customAt: 0,
  };

  const canvas = $('board'); let ctx = canvas.getContext('2d');

  // エージェントごとの distance 下界の達成状況。盤面の着色と一覧の表示で共有する
  const STATUS_RGB = { opt: '47,125,50', over: '178,106,0', todo: '119,119,119' };   // 緑 / 橙 / 灰
  function agentStatus(i) {
    const h = head(i), isDone = h === S.goals[i];
    const lb = S.dist[i][S.starts[i]];      // start から goal への最短手数 = 下界
    const rest = S.dist[i][h];              // 現在地から goal までの最短手数
    const mv = L.pathMoves(S.paths[i]);     // 待機を除いた移動回数
    // ここまでの移動 + 残りの最短 が下界と等しければ、まだ最短を保っている
    const onTrack = lb >= 0 && rest >= 0 && mv + rest === lb;
    const kind = (!isDone && mv === 0) ? 'todo' : onTrack ? 'opt' : 'over';
    return { isDone, lb, rest, mv, onTrack, kind, rgb: STATUS_RGB[kind] };
  }

  function agentColor(i, alpha) { const h = (i * 137.508) % 360; return `hsla(${h}, 70%, 50%, ${alpha == null ? 1 : alpha})`; }
  function cellXY(c) { return [c % S.map.w, Math.floor(c / S.map.w)]; }
  function cellCenter(c) { const [x, y] = cellXY(c); return [S.ox + (x + 0.5) * S.cell, S.oy + (y + 0.5) * S.cell]; }
  function head(i) { return S.paths[i][S.paths[i].length - 1]; }
  function isAdj(a, b) { const d = Math.abs(a - b); return (d === 1 && Math.floor(a / S.map.w) === Math.floor(b / S.map.w)) || d === S.map.w; }
  // ---- 解きかけの経路をこのブラウザに保存する (リロードや誤操作で失われないように)
  function wipKey(mapId, N) { return `human_mapf_wip:${mapId}:${N}`; }
  let wipTimer = null;
  function saveWip() {
    if (!S.map || S.mode !== 'edit') return;
    if (wipTimer) clearTimeout(wipTimer);
    wipTimer = setTimeout(() => {
      try {
        if (!S.paths.some(p => p.length > 1)) { localStorage.removeItem(wipKey(S.mapId, S.N)); return; }
        localStorage.setItem(wipKey(S.mapId, S.N), JSON.stringify({ t: Date.now(), paths: S.paths.map(p => encodePath(p)) }));
      } catch (e) { }
    }, 400);
  }
  // 保存した経路を復元する. 少しでもおかしければ捨てて初期状態に戻す
  function loadWip(mapId, N, starts, map) {
    let d;
    try { d = JSON.parse(localStorage.getItem(wipKey(mapId, N)) || 'null'); } catch (e) { return null; }
    if (!d || !Array.isArray(d.paths) || d.paths.length !== starts.length) return null;
    const out = [];
    for (let i = 0; i < starts.length; ++i) {
      const str = String(d.paths[i]);
      if (/[^UDLRW]/.test(str)) return null;
      let c = starts[i]; const p = [c];
      for (const ch of str) {
        const x = c % map.w;
        if (ch === 'R') { if (x === map.w - 1) return null; c += 1; }
        else if (ch === 'L') { if (x === 0) return null; c -= 1; }
        else if (ch === 'D') c += map.w;
        else if (ch === 'U') c -= map.w;
        if (c < 0 || c >= map.w * map.h || !map.free[c]) return null;
        p.push(c);
      }
      out.push(p);
    }
    return out.some(p => p.length > 1) ? out : null;
  }

  function bestKey(mapId, N) { return `human_mapf_best:${mapId}:${N}`; }
  function readBest(mapId, N) { try { return JSON.parse(localStorage.getItem(bestKey(mapId, N)) || 'null'); } catch (e) { return null; } }
  function mapName(id) { if (S.custom && id === S.mapId) return S.custom.name; return t('map.' + id); }

  // ============================================================ stage
  function loadStage(mapId, N) {
    S.custom = null;
    S.mapId = mapId; S.N = N; S.seed = M.stageSeed(mapId, N);
    S.map = M.getMap(mapId);
    S.G = L.buildGraph(S.map);
    const ins = M.getInstance(mapId, N, S.G);
    S.starts = ins.starts; S.goals = ins.goals;
    S.dist = S.goals.map(g => L.bfsDist(S.G, g));
    S.paths = S.starts.map(s => [s]);
    const wip = loadWip(mapId, N, S.starts, S.map);
    if (wip) S.paths = wip;
    S.sel = N > 0 ? 0 : -1; S.drag = null;
    S.undo = []; S.redo = [];
    S.mode = 'edit'; S.anim = null;
    S.ref = null; S.refPaths = null;
    S.best = readBest(mapId, N);
    S.lastResult = null;
    startReference();
    updateChampInfo();
    layout(); recompute(); renderAll();
    setStatus(wip ? t('wip.restored') : t('status.stage', mapName(mapId), N));
    saveMsg('');
  }

  // 埋め込み参考解 (src/reference.js, tools/precompute.js で生成). 無ければその場で LNS2 を実行
  function decodePath(start, str, w) {
    const p = [start]; let c = start;
    for (const ch of str) { c += ch === 'R' ? 1 : ch === 'L' ? -1 : ch === 'D' ? w : ch === 'U' ? -w : 0; p.push(c); }
    return p;
  }
  function loadEmbeddedReference() {
    const R = window.REFERENCE && window.REFERENCE[`${S.mapId}:${S.N}`];
    if (!R) return false;
    // インスタンスが一致するか検証 (生成コードが変わっていたら使わない)
    if (R.starts.length !== S.N || R.starts.some((v, i) => v !== S.starts[i]) || R.goals.some((v, i) => v !== S.goals[i])) return false;
    if (!R.paths) {
      // 経路なしの参考記録 (writer 採用ステージ: 作者の人力スコアのみ. 経路は投稿検証後に破棄されている)
      S.ref = { makespan: R.makespan, moves: R.moves }; S.refPaths = null; S.refState = 'ok';
      S.lb = R.lb;
      return true;
    }
    const paths = R.paths.map((str, i) => decodePath(S.starts[i], str, S.map.w));
    if (paths.some((p, i) => p[p.length - 1] !== S.goals[i] || p.some(c => !S.map.free[c]))) return false;
    if (L.findCollisions(paths, S.G.V, false).count !== 0) return false;
    const m = L.metrics(paths);
    S.ref = { makespan: m.makespan, moves: m.moves }; S.refPaths = paths; S.refState = 'ok';
    S.lb = R.lb;
    return true;
  }

  function startReference() {
    if (loadEmbeddedReference()) { updateRefPanel(); return; }
    S.refState = 'running';
    S.solver = new L.Solver(S.G, S.starts, S.goals, S.seed);
    S.solver.begin(8000);
    S.lb = S.solver.lowerBound;
    const mine = S.solver;
    const tick = () => {
      if (S.solver !== mine) return;
      const done = mine.step(25);
      if (!done) { updateRefPanel(); requestAnimationFrame(tick); return; }
      const r = mine.result();
      S.solver = null;
      if (r.ok) { S.ref = { makespan: r.makespan, moves: r.moves }; S.refPaths = r.paths; S.refState = 'ok'; }
      else { S.ref = null; S.refState = 'fail'; }
      S.lb = r.lowerBound;
      updateRefPanel(); draw();
    };
    requestAnimationFrame(tick);
  }

  // ============================================================ edit ops
  function snapshot() { S.undo.push(S.paths.map(p => p.slice())); if (S.undo.length > 300) S.undo.shift(); S.redo = []; }
  function doUndo() { if (!S.undo.length || S.mode !== 'edit') return; S.redo.push(S.paths.map(p => p.slice())); S.paths = S.undo.pop(); Sound.undo(); recompute(); renderAll(); }
  function doRedo() { if (!S.redo.length || S.mode !== 'edit') return; S.undo.push(S.paths.map(p => p.slice())); S.paths = S.redo.pop(); Sound.step(); recompute(); renderAll(); }

  function pushStep(i, c, silent) {
    const p = S.paths[i], h = p[p.length - 1];
    if (c !== h && !isAdj(h, c)) return false;
    if (!S.map.free[c]) return false;
    p.push(c);
    if (!silent) { if (c === h) Sound.wait(); else Sound.step(); if (c === S.goals[i] && c !== h) Sound.goal(); }
    return true;
  }
  function popStep(i) { const p = S.paths[i]; if (p.length > 1) { p.pop(); return true; } return false; }
  function select(i) { if (S.sel !== i) { S.sel = i; Sound.select(); renderAll(); } }

  // ============================================================ compute
  function edgeKey(a, b) { return a < b ? a * S.G.V + b : b * S.G.V + a; }
  // 同じ辺 (無向) を使うエージェントにレーン番号を割り当て, 経路が重ならないようにずらす
  function computeLanes() {
    const lanes = new Map();
    const add = (paths) => {
      for (let i = 0; i < paths.length; ++i) {
        const p = paths[i]; const seen = new Set();
        for (let k = 1; k < p.length; ++k) {
          if (p[k] === p[k - 1]) continue;
          const key = edgeKey(p[k - 1], p[k]);
          if (seen.has(key)) continue; seen.add(key);
          let arr = lanes.get(key); if (!arr) { arr = []; lanes.set(key, arr); }
          if (!arr.includes(i)) arr.push(i);
        }
      }
    };
    add(S.paths);
    S.lanes = lanes;
  }
  function recompute() {
    S.collisions = L.findCollisions(S.paths, S.G.V, true);
    S.metrics = L.metrics(S.paths);
    computeLanes();
    updatePanel();
    saveWip();
  }

  // ============================================================ layout / draw
  function layout() {
    const wrap = $('board-wrap');
    const availW = wrap.clientWidth - 8, availH = wrap.clientHeight - 8;
    const cs = Math.max(12, Math.min(56, Math.floor(Math.min(availW / S.map.w, availH / S.map.h))));
    S.cell = cs;
    const W = cs * S.map.w, H = cs * S.map.h;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S.ox = 0; S.oy = 0;
  }

  function drawBoard() {
    const { w, h, free } = S.map, cs = S.cell;
    ctx.fillStyle = '#f4f1ea'; ctx.fillRect(0, 0, w * cs, h * cs);
    ctx.fillStyle = '#3b3a37';
    for (let y = 0; y < h; ++y) for (let x = 0; x < w; ++x) if (!free[y * w + x]) ctx.fillRect(S.ox + x * cs, S.oy + y * cs, cs, cs);
    ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= w; ++x) { ctx.moveTo(S.ox + x * cs + 0.5, S.oy); ctx.lineTo(S.ox + x * cs + 0.5, S.oy + h * cs); }
    for (let y = 0; y <= h; ++y) { ctx.moveTo(S.ox, S.oy + y * cs + 0.5); ctx.lineTo(S.ox + w * cs, S.oy + y * cs + 0.5); }
    ctx.stroke();
  }

  function drawGoals() {
    const cs = S.cell;
    for (let i = 0; i < S.N; ++i) {
      const [cx, cy] = cellCenter(S.goals[i]); const r = cs * 0.36;
      ctx.lineWidth = i === S.sel ? 3 : 2; ctx.strokeStyle = agentColor(i, 0.9); ctx.fillStyle = agentColor(i, 0.12);
      ctx.beginPath(); ctx.rect(cx - r, cy - r, 2 * r, 2 * r); ctx.fill(); ctx.stroke();
      ctx.fillStyle = agentColor(i, 0.9); ctx.font = `${Math.max(8, cs * 0.34)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(i + 1), cx, cy + 1);
    }
  }

  // 辺 (a-b) 上でエージェント i に割り当てられた垂直方向オフセット (px)
  function laneOffset(i, a, b) {
    const arr = S.lanes && S.lanes.get(edgeKey(a, b));
    if (!arr || arr.length <= 1) return 0;
    const k = arr.indexOf(i); if (k < 0) return 0;
    const spacing = Math.min(S.cell * 0.14, (S.cell * 0.7) / arr.length);
    return (k - (arr.length - 1) / 2) * spacing;
  }

  function drawPath(path, i, alpha, width, dashed) {
    if (path.length < 2) return;
    const cs = S.cell;
    ctx.strokeStyle = agentColor(i, alpha); ctx.fillStyle = agentColor(i, alpha);
    ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    let lastOff = [0, 0];
    for (let k = 1; k < path.length; ++k) {
      const a = path[k - 1], b = path[k];
      if (a === b) {
        // 待機マーク (直前の辺のオフセット位置に)
        const [x, y] = cellCenter(a);
        ctx.beginPath(); ctx.arc(x + lastOff[0], y + lastOff[1], Math.max(2, cs * 0.09), 0, Math.PI * 2); ctx.fill();
        continue;
      }
      const off = laneOffset(i, a, b);
      const [x1, y1] = cellCenter(a), [x2, y2] = cellCenter(b);
      const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
      const ox = -uy * off, oy = ux * off; // 進行方向に垂直
      ctx.setLineDash(dashed ? [4, 4] : []);
      ctx.beginPath(); ctx.moveTo(x1 + ox, y1 + oy); ctx.lineTo(x2 + ox, y2 + oy); ctx.stroke();
      // 進行方向の矢じり (辺の中点)
      const mx = (x1 + x2) / 2 + ox, my = (y1 + y2) / 2 + oy, ah = Math.max(3, cs * 0.14);
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(mx + ux * ah * 0.6, my + uy * ah * 0.6);
      ctx.lineTo(mx - ux * ah * 0.5 - uy * ah * 0.55, my - uy * ah * 0.5 + ux * ah * 0.55);
      ctx.lineTo(mx - ux * ah * 0.5 + uy * ah * 0.55, my - uy * ah * 0.5 - ux * ah * 0.55);
      ctx.closePath(); ctx.fill();
      lastOff = [ox, oy];
    }
    ctx.setLineDash([]);
  }

  function drawAgent(x, y, i, r, label, sub) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = agentColor(i, 1); ctx.fill();
    ctx.lineWidth = i === S.sel ? 3 : 1.5; ctx.strokeStyle = i === S.sel ? '#111' : 'rgba(255,255,255,0.9)'; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.max(8, r * 0.95)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, x, y + 1);
    if (sub != null) {
      ctx.fillStyle = '#222'; ctx.font = `${Math.max(8, S.cell * 0.28)}px sans-serif`;
      const ly = y - r - S.cell * 0.18;
      ctx.fillText(sub, x, ly < S.cell * 0.2 ? y + r + S.cell * 0.22 : ly);
    }
  }

  function drawX(x, y, size, label) {
    ctx.strokeStyle = '#e02020'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - size, y - size); ctx.lineTo(x + size, y + size); ctx.moveTo(x + size, y - size); ctx.lineTo(x - size, y + size); ctx.stroke();
    if (label != null) {
      ctx.fillStyle = '#e02020'; ctx.font = `bold ${Math.max(8, S.cell * 0.3)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, x + size + S.cell * 0.22, y - size);
    }
  }

  function drawCollisions(maxT) {
    if (!S.collisions) return;
    const seen = new Set();
    for (const col of S.collisions.list) {
      if (maxT != null && col.t > maxT) continue;
      let x, y;
      if (col.type === 'vertex') { [x, y] = cellCenter(col.cell); }
      else { const a = cellCenter(col.cell), b = cellCenter(col.cell2); x = (a[0] + b[0]) / 2; y = (a[1] + b[1]) / 2; }
      const key = `${Math.round(x)},${Math.round(y)}`;
      if (seen.has(key)) continue; seen.add(key);
      drawX(x, y, S.cell * 0.3, 't=' + col.t);
    }
  }

  function draw() {
    if (!S.map) return;
    drawBoard();
    const cs = S.cell;
    if (S.mode === 'edit') {
      // 選択中のエージェントがいるマスとゴールのマスを、そのエージェントの色で塗る
      if (S.sel >= 0) {
        const st = agentStatus(S.sel);      // 緑 = 最短で到達 / 橙 = 遠回り / 灰 = 未到達
        const tint = (c, alpha) => {
          const [x, y] = cellXY(c);
          ctx.fillStyle = `rgba(${st.rgb},${alpha})`;
          ctx.fillRect(S.ox + x * cs, S.oy + y * cs, cs, cs);
        };
        tint(S.goals[S.sel], 0.18);
        tint(head(S.sel), 0.34);
      }
      drawGoals();
      for (let i = 0; i < S.N; ++i) if (i !== S.sel) drawPath(S.paths[i], i, 0.55, 3, false);
      if (S.sel >= 0) drawPath(S.paths[S.sel], S.sel, 0.95, 5, false);
      for (let i = 0; i < S.N; ++i) {
        if (S.paths[i].length === 1) continue;
        const [x, y] = cellCenter(S.starts[i]);
        ctx.beginPath(); ctx.arc(x, y, cs * 0.14, 0, Math.PI * 2); ctx.fillStyle = agentColor(i, 0.6); ctx.fill();
      }
      drawCollisions(null);
      const order = []; for (let i = 0; i < S.N; ++i) if (i !== S.sel) order.push(i); if (S.sel >= 0) order.push(S.sel);
      for (const i of order) {
        const [x, y] = cellCenter(head(i));
        const tt = S.paths[i].length - 1, done = head(i) === S.goals[i];
        drawAgent(x, y, i, cs * 0.36, String(i + 1), 't=' + tt + (done ? ' ✓' : ''));
      }
    } else {
      drawGoals();
      const a = S.anim, tt = a.t, t0 = Math.floor(tt), fr = tt - t0, P = a.paths;
      for (let i = 0; i < S.N; ++i) drawPath(P[i], i, 0.25, 2, a.isRef);
      if (a.failT != null && tt >= a.failT) drawCollisions(a.failT);
      for (let i = 0; i < S.N; ++i) {
        const c0 = L.posAt(P[i], t0), c1 = L.posAt(P[i], t0 + 1);
        const p0 = cellCenter(c0), p1 = cellCenter(c1);
        const ease = fr < 0.5 ? 2 * fr * fr : 1 - Math.pow(-2 * fr + 2, 2) / 2;
        drawAgent(p0[0] + (p1[0] - p0[0]) * ease, p0[1] + (p1[1] - p0[1]) * ease, i, cs * 0.36, String(i + 1), null);
      }
    }
  }
  function renderAll() { draw(); updatePanel(); }

  // ============================================================ panel
  function setStatus(msg, cls) { const e = $('status'); e.textContent = msg; e.className = 'status ' + (cls || ''); }

  // 参考解のソルバー名 (既定は LNS2. 埋め込み解を別ソルバーで作ったマップは MAP_DEFS の refSolver)
  function refSolver() {
    const d = M.MAP_DEFS.find(x => x.id === S.mapId);
    return (d && d.refSolver) || 'LNS2';
  }

  function updateRefPanel() {
    const e = $('ref-info');
    if (S.refState === 'running') e.innerHTML = t('ref.running', S.solver ? S.solver._iter : 0);
    else if (S.refState === 'ok') e.innerHTML = t('ref.ok', S.ref.makespan, S.ref.moves, refSolver());
    else if (S.refState === 'fail') e.innerHTML = t('ref.fail');
    else e.textContent = '';
    if (S.lb) $('lb-info').innerHTML = t('lb', S.lb.makespan, S.lb.moves);
  }

  function rankBadge(r) { return r ? `<span class="badge ${r}">${r.toUpperCase()}</span>` : ''; }

  // ランク: makespan と総移動距離の両方が参考解の何 % か (大きい方) で判定
  const RANKS = [['diamond', 1.0], ['platinum', 1.1], ['gold', 1.2], ['silver', 1.3], ['bronze', 1.5]];
  const RANK_ORDER = { diamond: 0, platinum: 1, gold: 2, silver: 3, bronze: 4, clear: 5 };
  function rankOf(m) {
    if (!S.ref) return { rank: 'clear', ratio: null, pm: null, pd: null };
    const rm = m.makespan / S.ref.makespan, rd = m.moves / S.ref.moves, worst = Math.max(rm, rd);
    let rank = 'clear';
    for (const [r, th] of RANKS) if (worst <= th + 1e-9) { rank = r; break; }
    return { rank, ratio: worst, pm: Math.round(rm * 100), pd: Math.round(rd * 100) };
  }
  // a が b (保存済みベスト) より良い記録か: ランク → 参考解比 → makespan → 総移動距離
  function betterRecord(a, b) {
    if (!b) return true;
    const ra = RANK_ORDER[a.rank] ?? 9, rb = RANK_ORDER[b.rank] ?? 9;
    if (ra !== rb) return ra < rb;
    if (a.ratio != null && b.ratio != null && Math.abs(a.ratio - b.ratio) > 1e-9) return a.ratio < b.ratio;
    return a.makespan < b.makespan || (a.makespan === b.makespan && a.moves < b.moves);
  }

  function updatePanel() {
    if (!S.metrics) return;
    const m = S.metrics;
    $('cur-makespan').textContent = m.makespan;
    $('cur-moves').textContent = m.moves;
    const nc = S.collisions ? S.collisions.count : 0;
    const col = $('cur-collisions'); col.textContent = nc; col.className = 'mono ' + (nc ? 'bad' : 'good');
    const done = S.paths.filter((p, i) => p[p.length - 1] === S.goals[i]).length;
    $('cur-done').textContent = `${done} / ${S.N}`;
    $('best-info').innerHTML = S.best ? t('best', S.best.makespan, S.best.moves, rankBadge(S.best.rank)) : t('best.none');
    const ul = $('agents'); ul.innerHTML = '';
    for (let i = 0; i < S.N; ++i) {
      const li = document.createElement('li');
      const h = head(i), tt = S.paths[i].length - 1, d = S.dist[i][h];
      const isDone = h === S.goals[i];
      const w = S.map.w;
      const hx = Math.floor(h / w), hy = h % w;                 // x は下方向 (行), y は右方向 (列)
      const g = S.goals[i], gx = Math.floor(g / w), gy = g % w;
      const st = agentStatus(i);
      const lb = st.lb, mv = st.mv;
      li.className = (i === S.sel ? 'sel ' : '') + (isDone ? 'done ' : '') + (S.collisions && S.collisions.conf[i] ? 'conf' : '');
      li.title = t('agent.tip', i + 1, hx, hy, gx, gy, mv, lb < 0 ? '∞' : lb,
        st.onTrack ? (st.isDone ? t('agent.tipOpt') : t('agent.tipOnTrack')) : t('agent.tipOver', mv + st.rest - lb));
      li.innerHTML = `<span class="dot" style="background:${agentColor(i)}"></span><span class="nm">${i + 1}</span>`
        + '<span class="ag">'
        +   `<span class="r1"><span class="co">(${hx},${hy})<i>→</i>(${gx},${gy})</span>${isDone ? '<span class="ok">✓</span>' : ''}</span>`
        +   `<span class="r2"><span class="mono">t=${tt}</span><span class="mono">${t('agent.remain', d < 0 ? '∞' : d)}</span>`
        +     `<span class="dl">${mv}/${lb < 0 ? '∞' : lb}</span></span>`
        + '</span>';
      li.onclick = () => select(i);
      ul.appendChild(li);
    }
    $('btn-undo').disabled = !S.undo.length; $('btn-redo').disabled = !S.redo.length;
    const solved = done === S.N && nc === 0 && S.N > 0;
    $('btn-gif').disabled = !solved || S.gifBusy || S.mode !== 'edit';
    $('btn-tweet').disabled = !S.lastResult;
    updateRefPanel();
  }

  // ============================================================ pointer
  function cellAt(ev) {
    const r = canvas.getBoundingClientRect();
    const x = Math.floor((ev.clientX - r.left - S.ox) / S.cell), y = Math.floor((ev.clientY - r.top - S.oy) / S.cell);
    if (x < 0 || y < 0 || x >= S.map.w || y >= S.map.h) return -1;
    return y * S.map.w + x;
  }
  function agentHeadAt(c) {
    if (c < 0) return -1;
    if (S.sel >= 0 && head(S.sel) === c) return S.sel;
    for (let i = S.N - 1; i >= 0; --i) if (head(i) === c) return i;
    return -1;
  }
  function agentOnCell(c) {
    if (c < 0) return -1;
    for (let i = 0; i < S.N; ++i) if (S.goals[i] === c) return i;
    for (let i = 0; i < S.N; ++i) if (S.paths[i].includes(c)) return i;
    return -1;
  }

  canvas.addEventListener('pointerdown', ev => {
    if (S.mode !== 'edit' || ev.button === 2) return;
    Sound.ensure();
    const c = cellAt(ev), i = agentHeadAt(c);
    if (i >= 0) {
      select(i);
      snapshot();
      S.drag = { i, added: 0, moved: false, last: c };
      try { canvas.setPointerCapture(ev.pointerId); } catch (e) { }
    } else {
      const j = agentOnCell(c);
      if (j >= 0) select(j);
    }
    ev.preventDefault();
  });

  canvas.addEventListener('pointermove', ev => {
    if (S.mode !== 'edit') return;
    const c = cellAt(ev);
    S.hover = c;
    if (!S.drag) { canvas.style.cursor = agentHeadAt(c) >= 0 ? 'grab' : 'default'; return; }
    if (c < 0 || c === S.drag.last) return;
    const d = S.drag, i = d.i, p = S.paths[i], h = p[p.length - 1];
    if (c === h) { d.last = c; return; }
    // 同一ドラッグ内で追加した直前のマスに戻ったら取り消し
    if (d.added > 0 && p.length >= 2 && p[p.length - 2] === c) {
      popStep(i); d.added--; d.moved = true; Sound.undo(); d.last = c; recompute(); draw(); return;
    }
    let steps = null;
    if (isAdj(h, c) && S.map.free[c]) steps = [c];
    else { const bp = L.bfsPath(S.G, h, c, 8); if (bp) steps = bp.slice(1); }
    if (steps) {
      for (const s of steps) if (pushStep(i, s, true)) d.added++;
      Sound.step();
      if (head(i) === S.goals[i]) Sound.goal();
      d.moved = true; recompute();
    }
    d.last = c;
    draw();
  });

  // ドラッグ終了: 途中で離しても, そこまでに追加した経路はそのまま残る
  function endDrag(isClick) {
    if (!S.drag) return;
    const d = S.drag; S.drag = null; S.hover = -1;
    if (!d.moved && isClick) { pushStep(d.i, head(d.i)); recompute(); }   // クリック → 待機 1 手
    else if (!d.moved) S.undo.pop();                                        // 変化なし → スナップショット破棄
    renderAll();
  }
  canvas.addEventListener('pointerup', () => endDrag(true));
  canvas.addEventListener('pointercancel', () => endDrag(false));
  canvas.addEventListener('lostpointercapture', () => endDrag(false));
  canvas.addEventListener('contextmenu', ev => {
    ev.preventDefault();
    if (S.mode !== 'edit' || S.drag) return;
    const c = cellAt(ev), i = agentHeadAt(c);
    if (i >= 0) { snapshot(); if (popStep(i)) Sound.undo(); else S.undo.pop(); recompute(); renderAll(); }
  });

  // ============================================================ keyboard
  window.addEventListener('keydown', ev => {
    if (ev.target && (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT' || ev.target.tagName === 'TEXTAREA')) return;
    if (!$('game').classList.contains('show')) return;
    if (ev.key === 'Escape') { if (S.mode === 'play') stopAnim(); else { $('help').classList.remove('show'); $('ranking').classList.remove('show'); $('rating').classList.remove('show'); $('maker').classList.remove('show'); $('inbox').classList.remove('show'); } return; }
    if (S.mode === 'play' && (ev.key === 'ArrowRight' || ev.key === '.')) { ev.preventDefault(); if (S.anim) seekAnim(Math.round(S.anim.t) + 1, true); return; }
    if (S.mode === 'play' && (ev.key === 'ArrowLeft' || ev.key === ',')) { ev.preventDefault(); if (S.anim) seekAnim(Math.round(S.anim.t) - 1, false); return; }
    if (S.mode !== 'edit') return;
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') { ev.preventDefault(); if (ev.shiftKey) doRedo(); else doUndo(); return; }
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'y') { ev.preventDefault(); doRedo(); return; }
    if (ev.key === 'Tab') { ev.preventDefault(); if (S.N) select(((S.sel + (ev.shiftKey ? -1 : 1)) + S.N) % S.N); return; }
    if (/^[1-9]$/.test(ev.key)) { const k = +ev.key - 1; if (k < S.N) select(k); return; }
    if (ev.key === 'Enter') { ev.preventDefault(); judge(); return; }
    if (S.sel < 0) return;
    const i = S.sel, h = head(i), w = S.map.w;
    const [hx, hy] = cellXY(h);
    let c = -1;
    if (ev.key === 'ArrowLeft' || ev.key === 'a') { if (hx > 0) c = h - 1; }
    else if (ev.key === 'ArrowRight' || ev.key === 'd') { if (hx < w - 1) c = h + 1; }
    else if (ev.key === 'ArrowUp' || ev.key === 'w') { if (hy > 0) c = h - w; }
    else if (ev.key === 'ArrowDown' || ev.key === 's') { if (hy < S.map.h - 1) c = h + w; }
    else if (ev.key === ' ' || ev.key === 'q') { c = h; }
    else if (ev.key === 'Backspace') { ev.preventDefault(); snapshot(); if (popStep(i)) Sound.undo(); else S.undo.pop(); recompute(); renderAll(); return; }
    else if (ev.key === 'Delete') { ev.preventDefault(); snapshot(); S.paths[i] = [S.starts[i]]; Sound.undo(); recompute(); renderAll(); return; }
    else return;
    ev.preventDefault();
    if (c < 0 || !S.map.free[c]) { Sound.error(); return; }
    snapshot(); pushStep(i, c); recompute(); renderAll();
  });

  // ============================================================ judge / animation
  function judge() {
    if (S.mode === 'play') {   // コマ送りで一時停止中なら再開
      const a = S.anim;
      if (a && a.paused) {
        if (a.t >= a.end) { a.t = 0; a.arrived.clear(); a.finished = false; }   // 終端からはもう一度最初から
        a.paused = false; a.last = performance.now(); $('btn-judge').disabled = true; $('btn-edit-here').disabled = true; requestAnimationFrame(animTick);
      }
      return;
    }
    startRun(false);
  }
  // 再生の開始. 未到達の経路があっても「衝突するか、全員が止まるまで」再生する (正解扱いにはしない).
  // paused=true はコマ送り用: t=0 で停止した状態から始める
  function startRun(paused) {
    if (S.mode !== 'edit') return;
    Sound.ensure();
    if (S.drag) endDrag(false);
    recompute();
    const notDone = S.paths.map((p, i) => p[p.length - 1] === S.goals[i] ? -1 : i).filter(i => i >= 0);
    const fail = S.collisions.count > 0;
    const failT = fail ? Math.min(...S.collisions.list.map(c => c.t)) : null;
    S.mode = 'play';
    S.anim = { t: 0, last: performance.now(), failT, end: fail ? failT : S.metrics.makespan, arrived: new Set(), paths: S.paths, isRef: false, makespan: S.metrics.makespan,
      notDone: notDone.length ? notDone : null, paused: !!paused, finished: false };
    $('btn-judge').disabled = !paused; $('btn-stop').disabled = false; $('btn-edit-here').disabled = !paused;
    if (fail) setStatus(t('judge.hasCol', S.collisions.count, failT), 'bad');
    else if (notDone.length) setStatus(t('judge.notDone', notDone.map(i => i + 1).join(', ')), 'bad');
    else setStatus(t('judge.running'), '');
    setAnimT(0, S.anim.makespan);
    if (paused) draw(); else requestAnimationFrame(animTick);
  }
  // 指定の手数へジャンプ (一時停止する). 数値入力とコマ送りの共通処理
  function seekAnim(tt, allowFinish) {
    const a = S.anim; if (!a || S.mode !== 'play') return;
    if (!a.paused) { a.paused = true; $('btn-judge').disabled = false; $('btn-edit-here').disabled = false; }
    a.t = Math.max(0, Math.min(a.end, Math.round(tt)));
    for (let i = 0; i < S.N; ++i) {
      const arriveT = L.trimPath(a.paths[i]).length - 1;
      if (a.t >= arriveT && arriveT > 0) a.arrived.add(i); else a.arrived.delete(i);
    }
    Sound.tick();
    setAnimT(a.t, a.makespan);
    draw();
    if (allowFinish && a.t >= a.end) finishAnim();
  }
  // 手数表示: 入力欄 (再生中は自動更新, 入力中は上書きしない)
  function setAnimT(tt, max) {
    const wrap = $('anim-t'), inp = $('anim-t-in');
    wrap.style.display = '';
    inp.disabled = false; inp.max = max;
    if (document.activeElement !== inp) inp.value = Math.floor(tt);
    $('anim-t-max').textContent = max;
  }

  function animTick(now) {
    const a = S.anim; if (!a || S.mode !== 'play' || a.paused) return;
    const dt = (now - a.last) / 1000; a.last = now;
    const prevT = a.t;
    a.t = Math.min(a.end, a.t + dt * S.speed);
    if (Math.floor(a.t) !== Math.floor(prevT)) Sound.tick();
    for (let i = 0; i < S.N; ++i) {
      const arriveT = L.trimPath(a.paths[i]).length - 1;
      if (!a.arrived.has(i) && a.t >= arriveT && arriveT > 0) { a.arrived.add(i); if (a.failT == null) Sound.goal(); }
    }
    setAnimT(a.t, a.makespan);
    draw();
    if (a.t >= a.end) { finishAnim(); return; }
    requestAnimationFrame(animTick);
  }

  function finishAnim() {
    const a = S.anim;
    if (a.finished) return;
    a.finished = true;
    // 終端で一時停止して待機する (「経路計画に戻る」を押すまで編集へは戻らない)
    const hold = () => { a.paused = true; $('btn-judge').disabled = false; $('btn-edit-here').disabled = false; setAnimT(a.t, a.makespan); };
    if (a.failT != null) {
      Sound.error(); draw();
      setStatus(t('judge.colFail', a.failT), 'bad');
      hold();
      return;
    }
    if (a.notDone) {
      Sound.error(); draw();
      setStatus(t('judge.notDone', a.notDone.map(i => i + 1).join(', ')), 'bad');
      hold();
      return;
    }
    const m = S.metrics; const rk = rankOf(m), rank = rk.rank;
    if (rank === 'diamond' || rank === 'platinum') Sound.gold(); else Sound.fanfare();
    let msg = t('judge.ok', m.makespan, m.moves);
    if (S.ref) msg += t('judge.refPart', S.ref.makespan, S.ref.moves);
    if (S.lb) msg += t('judge.lbPart', S.lb.makespan, S.lb.moves);
    const prev = S.best;
    const better = betterRecord({ rank, ratio: rk.ratio, makespan: m.makespan, moves: m.moves }, prev);
    if (better) {
      S.best = { makespan: m.makespan, moves: m.moves, rank, ratio: rk.ratio };
      try { localStorage.setItem(bestKey(S.mapId, S.N), JSON.stringify(S.best)); } catch (e) { }
      msg += t('judge.newBest');
    }
    setStatus(msg, 'good');
    S.lastResult = { makespan: m.makespan, moves: m.moves, rank, paths: S.paths.map(p => encodePath(L.trimPath(p))), rankMakespan: null, rankMoves: null };
    showResult(rank, m, better, rk);
    const a2 = S.anim;
    if (a2) { a2.paused = true; $('btn-judge').disabled = false; $('btn-edit-here').disabled = false; setAnimT(a2.t, a2.makespan); }
  }

  function stopAnim() {
    S.mode = 'edit'; S.anim = null;
    $('btn-judge').disabled = false; $('btn-stop').disabled = true; $('btn-edit-here').disabled = true;
    $('anim-t').style.display = 'none'; $('anim-t-in').value = ''; $('anim-t-in').disabled = true;
    renderAll();
  }

  // コマ送りで止めた時刻から経路を作り直す: 各経路を t 手までに切り詰めて編集モードへ (undo 可)
  function editFromHere() {
    const a = S.anim; if (S.mode !== 'play' || !a || !a.paused) return;
    const tt = Math.round(a.t);
    if (!confirm(t('confirm.editHere', tt))) return;
    snapshot();
    S.paths = S.paths.map(p => p.slice(0, Math.min(p.length, tt + 1)));
    stopAnim();
    recompute(); renderAll();
    setStatus(t('judge.editHere', tt), '');
    Sound.select();
  }

  function showResult(rank, m, better, rk) {
    if (S.custom) return showCustomResult(m);
    const box = $('result');
    const refLb = (rv, lv, pct) => S.ref ? ` <span class="sub">${t('result.refLb', rv, lv, pct)}</span>` : '';
    const lbForm = lbFormHtml();
    box.innerHTML = `<div class="rank">${rank.toUpperCase()}</div>
      <div>${t('result.makespan')} <b class="mono">${m.makespan}</b>${refLb(S.ref && S.ref.makespan, S.lb && S.lb.makespan, rk.pm)}</div>
      <div>${t('result.moves')} <b class="mono">${m.moves}</b>${refLb(S.ref && S.ref.moves, S.lb && S.lb.moves, rk.pd)}</div>
      ${better ? `<div class="sub">${t('result.newBest')}</div>` : ''}
      <div class="sub">${t('result.' + rank, refSolver())}</div>
      <div class="note">${t('result.ranks')}</div>
      ${lbForm}
      <div class="row"><button id="res-gif">${t('btn.gif')}</button><button id="res-tweet">${t('btn.tweet')}</button><button id="res-ranking">${t('btn.ranking')}</button></div>
      <div class="note">${t('tweet.note')}</div>
      <button id="result-close">${t('btn.close')}</button>`;
    box.className = 'result show ' + rank;
    $('result-close').onclick = () => { box.className = 'result'; };
    $('res-gif').onclick = () => exportGif();
    $('res-tweet').onclick = () => tweet();
    $('res-ranking').onclick = () => showRanking();
    wireResultForm();
  }

  // ログイン済みなら名前は固定表示 (騙れないので入力欄は出さない). 未ログインならログインへ誘導する
  function lbFormHtml() {
    if (!LB.configured()) return `<div class="lb-msg">${t('lb.notConfigured')}</div>`;
    if (!USER) return `<div class="lb-form"><button id="lb-login" class="primary">${t('auth.loginToSubmit')}</button></div><div id="lb-msg" class="lb-msg">${t('auth.needLogin')}</div>`;
    return `<div class="lb-form"><span class="who">${escapeHtml(USER.name)}</span><button id="lb-submit" class="primary">${t('lb.submit')}</button></div><div id="lb-msg" class="lb-msg"></div>`;
  }
  function wireResultForm() {
    if ($('lb-submit')) $('lb-submit').onclick = () => submitScore();
    if ($('lb-login')) $('lb-login').onclick = () => openAuth('login');
  }
  // ログイン状態が変わったら、開いている結果パネルのフォームを差し替える
  function refreshResultForm() {
    const holder = $('result').querySelector('.lb-form');
    if (!holder) return;
    const wrap = document.createElement('div');
    wrap.innerHTML = lbFormHtml();
    const msg = $('result').querySelector('#lb-msg');
    holder.replaceWith(...wrap.childNodes);
    if (msg && $('result').querySelector('#lb-msg') !== msg) msg.remove();
    wireResultForm();
  }

  // ============================================================ ranking
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  // ---- ログイン状態 (このブラウザに保存する). token はサーバーが発行した値
  const AUTH_KEY = 'human_mapf_auth';
  let USER = null;
  try { USER = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (e) { USER = null; }
  if (USER && !(USER.name && USER.token)) USER = null;
  function setUser(u) {
    USER = u;
    try { u ? localStorage.setItem(AUTH_KEY, JSON.stringify(u)) : localStorage.removeItem(AUTH_KEY); } catch (e) { }
    renderAccount();
    renderNotice();
    if ($('result').classList.contains('show')) refreshResultForm();
    if ($('maker').classList.contains('show')) renderMaker();
  }
  function playerName() { return USER ? USER.name : ''; }

  // ---- ホームのお知らせ (レーティング導入の案内). 閉じたらこのブラウザでは出さない (キーを変えると再表示される)
  const NOTICE_KEY = 'human_mapf_notice_maker';
  function noticeDismissed() { try { return localStorage.getItem(NOTICE_KEY) === '1'; } catch (e) { return false; } }
  function renderNotice() {
    const el = $('notice'); if (!el) return;
    if (!LB.configured() || noticeDismissed()) { el.className = 'notice'; el.innerHTML = ''; return; }
    el.innerHTML = `<h3>${t('notice.title')}<span class="date">${t('notice.date')}</span></h3>
      <p>${t('notice.lead')}</p>
      <ul><li>${t('notice.i1')}</li></ul>
      ${USER ? `<p class="done">${t('notice.loggedIn', escapeHtml(USER.name))}</p>` : ''}
      <div class="row"><button class="notice-rating">${t('rating.btn')}</button><button class="notice-close">${t('notice.close')}</button></div>`;
    const rb = el.querySelector('.notice-rating');
    if (rb) rb.onclick = () => showRatings();
    el.className = 'notice show';
    const b = el.querySelector('.notice-close');
    if (b) b.onclick = () => { try { localStorage.setItem(NOTICE_KEY, '1'); } catch (e) { } renderNotice(); renderAccount(); };
  }

  function renderAccount() {
    const mine = USER && S.ratings ? S.ratings.players.find(p => LB.nameKey(p.name) === LB.nameKey(USER.name)) : null;
    const rt = !USER ? '' : mine
      ? `<button class="rating-open ${ratingClass(mine.rating)}" title="${t('rating.mine')}">${mine.rating}</button>`
      : `<button class="rating-open unrated" title="${t('rating.mine')}">${t('rating.none')}</button>`;
    const html = !LB.configured() ? ''
      : USER
        ? `<span class="who ${mine ? ratingClass(mine.rating) : ''}">${escapeHtml(USER.name)}</span>${rt}<button class="auth-out">${t('auth.logout')}</button>`
        : `<button class="auth-in">${t('auth.login')}</button><button class="auth-up">${t('auth.register')}</button>`;
    const reopen = (!LB.configured() || !noticeDismissed()) ? '' : `<button class="notice-open">${t('notice.reopen')}</button>`;
    for (const id of ['home-account', 'game-account']) {
      const el = $(id); if (!el) continue;
      el.innerHTML = (id === 'home-account' ? reopen : '') + html;
      const q = (c, fn) => { const b = el.querySelector(c); if (b) b.onclick = fn; };
      q('.auth-out', () => setUser(null));
      q('.rating-open', () => showRatings());
      q('.auth-in', () => openAuth('login'));
      q('.auth-up', () => openAuth('register'));
      q('.notice-open', () => { try { localStorage.removeItem(NOTICE_KEY); } catch (e) { } renderNotice(); renderAccount(); $('notice').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); });
    }
  }

  // ---- ログイン / 新規登録モーダル
  let AUTH_MODE = 'login', authTimer = null;
  function openAuth(mode, presetName) {
    AUTH_MODE = mode;
    $('auth').classList.add('show');
    $('auth-msg').textContent = ''; $('auth-msg').className = 'lb-msg';
    $('auth-hint').textContent = ''; $('auth-hint').className = 'auth-hint';
    if (presetName != null) $('auth-name').value = presetName;
    $('auth-pw').value = '';
    applyAuthLang();
    setTimeout(() => ($('auth-name').value ? $('auth-pw') : $('auth-name')).focus(), 50);
  }
  function closeAuth() { $('auth').classList.remove('show'); if (authTimer) clearTimeout(authTimer); }
  function applyAuthLang() {
    const reg = AUTH_MODE === 'register';
    $('auth-title').textContent = t(reg ? 'auth.titleRegister' : 'auth.titleLogin');
    $('auth-tab-login').textContent = t('auth.login');
    $('auth-tab-register').textContent = t('auth.register');
    $('auth-tab-login').className = reg ? '' : 'on';
    $('auth-tab-register').className = reg ? 'on' : '';
    $('auth-name-label').textContent = t('auth.name');
    $('auth-pw-label').textContent = t('auth.password');
    $('auth-pw').autocomplete = reg ? 'new-password' : 'current-password';
    $('auth-go').textContent = t(reg ? 'auth.goRegister' : 'auth.goLogin');
    $('auth-note').innerHTML = t('auth.note');
  }
  // 新規登録のときだけ、入力中の名前が使えるかをサーバーに問い合わせる
  function scheduleNameCheck() {
    if (authTimer) clearTimeout(authTimer);
    if (AUTH_MODE !== 'register') { $('auth-hint').textContent = ''; return; }
    const name = LB.sanitizeName($('auth-name').value);
    const hint = $('auth-hint');
    if (!name) { hint.textContent = ''; hint.className = 'auth-hint'; return; }
    hint.textContent = t('auth.hintChecking'); hint.className = 'auth-hint';
    authTimer = setTimeout(async () => {
      try {
        const r = await LB.checkName(name);
        if (LB.nameKey($('auth-name').value) !== LB.nameKey(name)) return;   // 入力が変わっていたら捨てる
        if (r.taken) { hint.textContent = t('auth.hintTaken'); hint.className = 'auth-hint err'; }
        else if (r.legacy) { hint.textContent = t('auth.hintLegacy', r.submissions); hint.className = 'auth-hint warn'; }
        else { hint.textContent = t('auth.hintFree'); hint.className = 'auth-hint'; }
      } catch (e) { hint.textContent = ''; }
    }, 400);
  }
  function authErrorText(e) {
    const d = e.detail || {}, msg = String(e.message || e);
    if (e.timeout || msg === 'timeout') return t('auth.errTimeout');
    if (msg === 'no such user') return t('auth.errNoUser');
    if (msg.indexOf('not registered') === 0) return t('auth.errLegacy', d.submissions || 0);
    if (msg === 'wrong password') return t('auth.errPassword', d.remaining == null ? 0 : d.remaining);
    if (msg === 'locked') return t('auth.errLocked', d.retryAfter || 60);
    if (msg === 'name taken') return t('auth.errTaken');
    if (msg === 'password too short') return t('auth.errShortPw');
    if (msg === 'bad name') return t('auth.errName');
    return t('auth.errFail', msg);
  }
  async function submitAuth() {
    const name = LB.sanitizeName($('auth-name').value), pw = $('auth-pw').value;
    const msg = $('auth-msg'), go = $('auth-go');
    msg.className = 'lb-msg';
    if (!name) { msg.className = 'lb-msg err'; msg.textContent = t('auth.errName'); $('auth-name').focus(); return; }
    if (AUTH_MODE === 'register' && pw.length < 8) { msg.className = 'lb-msg err'; msg.textContent = t('auth.errShortPw'); $('auth-pw').focus(); return; }
    go.disabled = true; msg.textContent = t('auth.working');
    try {
      const r = AUTH_MODE === 'register' ? await LB.register(name, pw) : await LB.login(name, pw);
      setUser({ name: r.name, token: r.token });
      msg.className = 'lb-msg';
      msg.textContent = AUTH_MODE === 'register'
        ? (r.claimed > 0 ? t('auth.okClaim', r.claimed) : t('auth.okRegister', r.name))
        : t('auth.okLogin', r.name);
      Sound.select();
      setTimeout(() => { closeAuth(); if ($('result').classList.contains('show')) refreshResultForm(); }, 900);
    } catch (e) {
      msg.className = 'lb-msg err'; msg.textContent = authErrorText(e);
      if (String(e.message).indexOf('not registered') === 0) { AUTH_MODE = 'register'; applyAuthLang(); }
    } finally { go.disabled = false; }
  }
  function stageKey() { return `${S.mapId}:${S.N}`; }
  function encodePath(p) {
    let out = '';
    for (let k = 1; k < p.length; ++k) { const d = p[k] - p[k - 1]; out += d === 0 ? 'W' : d === 1 ? 'R' : d === -1 ? 'L' : d === S.map.w ? 'D' : 'U'; }
    return out;
  }

  async function submitScore() {
    const r = S.lastResult; if (!r || !LB.configured()) return;
    if (!USER) { openAuth('login'); return; }
    const msg = $('lb-msg'), btn = $('lb-submit');
    if (!btn) return;
    btn.disabled = true; msg.className = 'lb-msg'; msg.textContent = t('lb.submitting');
    try {
      const res = await LB.submit(stageKey(), USER.name, USER.token, r.paths);
      const name = res.name || USER.name;
      r.name = name;
      r.rankMakespan = { rank: res.makespan.rank, total: res.makespan.total };
      r.rankMoves = { rank: res.moves.rank, total: res.moves.total };
      if (res.total) r.rankTotal = { rank: res.total.rank, total: res.total.total };
      msg.innerHTML = t('lb.result', res.makespan.rank, res.makespan.total, res.moves.rank, res.moves.total,
        (res.total && res.total.rank) || 0, (res.total && res.total.total) || 0)
        + ((res.makespan.improved || res.moves.improved) ? '' : ` <span class="sub">${t('lb.notImproved')}</span>`);
      S.champs = null; S.ratingsAt = 0; updateChampInfo(); updatePanel();
      Sound.goal();
    } catch (e) {
      const em = String(e.message || e);
      if (em.indexOf('bad token') === 0 || em.indexOf('login required') === 0) {
        // シート側でトークンが無効にされた / 別端末で作り直された場合
        setUser(null);   // ここでフォームが「ログインして登録」に差し替わる
        const m2 = $('lb-msg');
        if (m2) { m2.className = 'lb-msg err'; m2.textContent = t('auth.sessionExpired'); }
        openAuth('login', r.name || '');
        return;
      }
      msg.className = 'lb-msg err'; msg.textContent = t('lb.submitFail', em);
      btn.disabled = false;
    }
  }

  function rankTable(entries, showProduct) {
    if (!entries.length) return `<div class="sub">${t('lb.empty')}</div>`;
    const me = playerName();
    return `<table class="lb"><tr><th>${t('lb.rank')}</th><th>${t('lb.name')}</th><th>makespan</th><th>distance</th>${showProduct ? '<th>積</th>' : ''}</tr>` +
      entries.map((e, i) => `<tr class="${e.name === me ? 'me' : ''}"><td>${i + 1}</td><td>${escapeHtml(e.name)}</td><td class="mono">${e.makespan}</td><td class="mono">${e.moves}</td>${showProduct ? `<td class="mono b">${e.makespan * e.moves}</td>` : ''}</tr>`).join('') + '</table>';
  }

  async function showRanking() {
    const ov = $('ranking'), body = $('ranking-body');
    $('ranking-title').textContent = t('lb.title', mapName(S.mapId), S.N);
    ov.classList.add('show');
    if (!LB.configured()) { body.innerHTML = `<div class="lb-msg">${t('lb.notConfigured')}</div>`; return; }
    body.innerHTML = `<div class="lb-msg">${t('lb.loading')}</div>`;
    try {
      const b = await LB.top(stageKey());
      body.innerHTML = `<div class="sub">${t('lb.players', Math.max(b.makespan.length, b.moves.length, b.total.length))}</div>
        <div class="lb-col lb-top"><h3>${t('lb.total')}</h3><div class="lb-note">${t('lb.totalNote')}</div>${rankTable(b.total, true)}</div>
        <div class="lb-cols">
          <div class="lb-col"><h3>${t('lb.makespan')}</h3>${rankTable(b.makespan)}</div>
          <div class="lb-col"><h3>${t('lb.moves')}</h3>${rankTable(b.moves)}</div>
        </div>`;
    } catch (e) { body.innerHTML = `<div class="lb-msg err">${t('lb.error', escapeHtml(e.message || e))}</div>`; }
  }

  // 各ステージの 1 位 (ホームのチップとゲーム画面に表示). 60 秒キャッシュ
  async function fetchChamps() {
    if (!LB.configured()) return null;
    if (S.champs && Date.now() - S.champsAt < 60000) return S.champs;
    try { S.champs = await LB.all(); S.champsAt = Date.now(); S.champsErr = false; }
    catch (e) { S.champsErr = true; }   // 失敗しても前回取得した内容は残す (60 秒後にまた試す)
    return S.champs;
  }
  async function updateChampInfo() {
    const el = $('champ-info');
    if (S.custom) { el.textContent = ''; return; }
    if (!LB.configured()) { el.textContent = ''; return; }
    const key = stageKey();
    const c = await fetchChamps();
    if (key !== stageKey()) return;
    const b = c && c[key];
    el.innerHTML = b && b.makespan
      ? t('champ.line', escapeHtml(b.makespan.name), b.makespan.makespan, escapeHtml(b.moves.name), b.moves.moves, b.players,
          b.total ? escapeHtml(b.total.name) : '-', b.total ? b.total.makespan * b.total.moves : '-')
      : t(!c && S.champsErr ? 'champ.error' : 'champ.none');
  }
  // ステージ選択のチップに両部門の 1 位を表示 (⏱️ = makespan 部門 / 👣 = total distance 部門)
  const ICON_MS = '⏱️', ICON_MV = '👣', ICON_TOTAL = '👑';
  function crownLine(icon, name, tip, cls) {
    const sp = document.createElement('span');
    sp.className = 'crown ' + cls;
    sp.textContent = `${icon} ${name}`;
    sp.title = tip;
    return sp;
  }
  // ============================================================ difficulty / rating
  // AtCoder と同じ色分け. 灰 0〜399 / 茶 / 緑 / 水 / 青 / 黄 / 橙 / 赤 2800〜
  const RATING_BANDS = [[2800, 'red'], [2400, 'orange'], [2000, 'yellow'], [1600, 'blue'], [1200, 'cyan'], [800, 'green'], [400, 'brown'], [-Infinity, 'gray']];
  function ratingClass(v) { return 'rt-' + RATING_BANDS.find(([lo]) => v >= lo)[1]; }
  // サーバーの値 (成績によるフィードバック後) があればそれ, 無ければ埋め込みの計測値 d0
  function diffInfo(stage) {
    const base = window.DIFFICULTY && window.DIFFICULTY[stage];
    const srv = S.ratings && S.ratings.stages[stage];
    if (!base && !srv) return null;
    return { d: srv ? srv.d : base.d0, d0: base ? base.d0 : srv.d0, players: srv ? srv.players : 0 };
  }
  // AtCoder Problems 風の丸: 色の帯の中でどこまで来たかを下から塗る. big=true なら数値も添える
  function diffBadge(stage, big) {
    const i = diffInfo(stage); if (!i) return '';
    const d = Math.max(0, i.d), lo = d >= 2800 ? 2800 : Math.floor(d / 400) * 400;
    const pct = d >= 3200 ? 100 : Math.round((d - lo) / 400 * 100);
    const tip = t('diff.tip', d, i.d0, i.players);
    return `<span class="diff ${ratingClass(d)}" style="--p:${pct}%" title="${tip}"></span>${big ? `<span class="diffnum ${ratingClass(d)}" title="${tip}">${d}</span>` : ''}`;
  }
  async function fetchRatings() {
    if (!LB.configured()) return null;
    if (S.ratings && Date.now() - S.ratingsAt < 300000) return S.ratings;
    try { S.ratings = await LB.ratings(); S.ratingsAt = Date.now(); } catch (e) { }
    return S.ratings;
  }
  // サーバーの difficulty が届いたらチップの丸を描き直し, アカウント欄に rating を出す
  async function decorateDifficulty() {
    const had = !!S.ratings;
    const r = await fetchRatings(); if (!r) return;
    document.querySelectorAll('#stage-cards .chip[data-stage]').forEach(ch => {
      const old = ch.querySelector('.diff'); if (!old) return;
      const wrap = document.createElement('span'); wrap.innerHTML = diffBadge(ch.getAttribute('data-stage'));
      if (wrap.firstChild) old.replaceWith(wrap.firstChild);
    });
    if (!had) renderAccount();
  }
  async function showRatings() {
    const ov = $('rating'), body = $('rating-body');
    $('rating-title').textContent = t('rating.title');
    ov.classList.add('show');
    if (!LB.configured()) { body.innerHTML = `<div class="lb-msg">${t('lb.notConfigured')}</div>`; return; }
    body.innerHTML = `<div class="lb-msg">${t('lb.loading')}</div>`;
    const r = await fetchRatings();
    if (!r) { body.innerHTML = `<div class="lb-msg err">${t('lb.error', 'network')}</div>`; return; }
    const me = LB.nameKey(playerName());
    const rows = r.players.map((p, i) => `<tr class="${LB.nameKey(p.name) === me ? 'me' : ''}"><td>${i + 1}</td><td class="${ratingClass(p.rating)}">${escapeHtml(p.name)}</td><td class="mono ${ratingClass(p.rating)}">${p.rating}</td><td class="mono">${p.solved}</td><td class="mono">${p.atPar}</td><td class="mono">${p.best} <span class="sub">${escapeHtml(stageLabel(p.bestStage))}</span></td></tr>`).join('');
    body.innerHTML = `<div class="note">${t('rating.note')}</div>
