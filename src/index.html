<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Human MAPF — 人力マルチエージェント経路計画</title>
<meta name="description" content="Human MAPF: 全員をぶつけずにゴールへ導くマルチエージェント経路計画パズル。makespan と総移動距離で LNS2 と競う。 / Solve multi-agent path finding by hand and compete with a solver.">
<meta property="og:title" content="Human MAPF">
<meta property="og:description" content="人力でマルチエージェント経路計画 (MAPF) を解くパズル / Solve MAPF by hand. Plays in any browser, no install.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://hirokinagai-39.github.io/human-mapf/assets/hero.png">
<meta property="og:image:width" content="2400">
<meta property="og:image:height" content="1260">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://hirokinagai-39.github.io/human-mapf/assets/hero.png">
<meta name="theme-color" content="#2b2a28">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232b2a28'/%3E%3Ccircle cx='11' cy='11' r='6' fill='%23e0492f'/%3E%3Crect x='16' y='16' width='11' height='11' rx='2' fill='none' stroke='%232f6fe0' stroke-width='3'/%3E%3C/svg%3E">
<!-- BUILD:CSS --><link rel="stylesheet" href="style.css"><!-- /BUILD:CSS -->
</head>
<body>
<noscript><p style="padding:20px">This game requires JavaScript. / このゲームには JavaScript が必要です。</p></noscript>

<!-- ================= home ================= -->
<div id="home" class="screen show">
  <div class="home-inner">
    <div class="topbar">
      <span id="home-account" class="account"></span>
      <button id="home-lang" class="lang">EN</button>
    </div>
    <div class="hero">
      <h1>Human MAPF</h1>
      <p class="subtitle" data-i18n="subtitle"></p>
      <p class="tagline" data-i18n="tagline"></p>
      <div class="row">
        <button id="home-sound"></button>
        <a href="#tutorial" class="btn-link" data-i18n="home.tutorialLink"></a>
      </div>
    </div>
    <h2 class="section-title" data-i18n="home.stages"></h2>
    <div id="stage-cards" class="stage-cards"></div>
    <h2 class="section-title" id="tutorial" data-i18n="home.howto"></h2>
    <div id="tutorial-home" class="tutorial"></div>
    <footer class="home-footer">© 2026 Hiroki Nagai · <a href="https://creativecommons.org/licenses/by-nd/4.0/" target="_blank" rel="noopener">CC BY-ND 4.0</a> (no modified redistribution / 改変版の再配布禁止) · <a href="https://github.com/HirokiNagai-39/human-mapf" target="_blank" rel="noopener">GitHub</a></footer>
  </div>
</div>

<!-- ================= game ================= -->
<div id="game" class="screen">
  <header>
    <button id="btn-home" data-i18n="btn.home"></button>
    <h1 id="stage-title">Human MAPF</h1>
    <span style="flex:1"></span>
    <span id="game-account" class="account"></span>
    <button id="btn-lang" class="lang">EN</button>
    <button id="btn-sound"></button>
    <button id="btn-help" data-i18n="btn.help"></button>
  </header>
  <main>
    <div id="board-wrap"><canvas id="board"></canvas></div>
    <aside>
      <div id="status" class="status"></div>
      <div class="card">
        <div class="row">
          <button id="btn-judge" class="primary" data-i18n="btn.judge"></button>
          <button id="btn-stop" disabled data-i18n="btn.stop"></button>
          <span id="anim-t"></span>
        </div>
        <div class="row" style="margin-top:6px">
          <label><span data-i18n="label.speed"></span> <input id="speed" type="range" min="1" max="12" step="1"> <span id="speed-val"></span></label>
        </div>
      </div>
      <div class="card">
        <h2 data-i18n="card.score"></h2>
        <div class="kv">
          <span data-i18n="score.makespan"></span><span class="v mono" id="cur-makespan">0</span>
          <span data-i18n="score.moves"></span><span class="v mono" id="cur-moves">0</span>
          <span data-i18n="score.collisions"></span><span class="v mono" id="cur-collisions">0</span>
          <span data-i18n="score.done"></span><span class="v mono" id="cur-done">0 / 0</span>
        </div>
        <div id="lb-info" style="margin-top:6px;color:#555"></div>
        <div id="ref-info" style="margin-top:2px"></div>
        <div id="best-info" style="margin-top:2px"></div>
      </div>
      <div class="card">
        <h2 data-i18n="card.edit"></h2>
        <div class="row">
          <button id="btn-undo" data-i18n="btn.undo"></button>
          <button id="btn-redo" data-i18n="btn.redo"></button>
          <button id="btn-clear-agent" data-i18n="btn.clearAgent"></button>
          <button id="btn-clear-all" data-i18n="btn.clearAll"></button>
        </div>
      </div>
      <div class="card">
        <h2 data-i18n="card.share"></h2>
        <div class="row">
          <button id="btn-ranking" data-i18n="btn.ranking"></button>
          <button id="btn-gif" disabled data-i18n="btn.gif"></button>
          <button id="btn-tweet" disabled data-i18n="btn.tweet"></button>
        </div>
        <div id="champ-info" class="champ"></div>
      </div>
      <div class="card">
        <h2 data-i18n="card.agents"></h2>
        <ul id="agents"></ul>
      </div>
    </aside>
  </main>
</div>

<div id="result" class="result"></div>
<div id="ranking" class="overlay">
  <div class="box">
    <div class="row" style="justify-content:space-between"><h2 id="ranking-title" style="margin:0"></h2><button id="ranking-close" data-i18n="btn.close"></button></div>
    <div id="ranking-body"></div>
  </div>
</div>
<div id="auth" class="overlay">
  <div class="box auth-box">
    <div class="row" style="justify-content:space-between"><h2 id="auth-title" style="margin:0"></h2><button id="auth-close" data-i18n="btn.close"></button></div>
    <div class="auth-tabs"><button id="auth-tab-login" type="button"></button><button id="auth-tab-register" type="button"></button></div>
    <div class="auth-form">
      <label><span id="auth-name-label"></span><input id="auth-name" maxlength="16" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
      <label><span id="auth-pw-label"></span><input id="auth-pw" type="password" maxlength="72" autocomplete="current-password"></label>
    </div>
    <div id="auth-hint" class="auth-hint"></div>
    <div class="row" style="justify-content:center"><button id="auth-go" class="primary"></button></div>
    <div id="auth-msg" class="lb-msg"></div>
    <div id="auth-note" class="note"></div>
  </div>
</div>

<div id="help">
  <div class="box">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0" data-i18n="home.howto"></h2><button id="help-close" data-i18n="btn.close"></button></div>
    <div id="tutorial-game" class="tutorial"></div>
  </div>
</div>

<!-- BUILD:JS -->
<script src="lns2.js"></script>
<script src="maps.js"></script>
<script src="reference.js"></script>
<script src="config.js"></script>
<script src="gif.js"></script>
<script src="leaderboard.js"></script>
<script src="game.js"></script>
<!-- /BUILD:JS -->
</body>
</html>
