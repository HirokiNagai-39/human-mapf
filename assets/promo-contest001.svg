<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.18"/></filter></defs>
<rect width="1200" height="880" fill="#e9e5dc"/><text x="600" y="66" font-size="40" font-weight="800" fill="#2b2a28" text-anchor="middle" letter-spacing="0.5">Human MAPF Contest 001 を開催します!</text><g filter="url(#sh)"><rect x="56" y="116" width="400" height="400" rx="14" fill="#2b2a28"/></g><g stroke="#fff" stroke-opacity="0.055" stroke-width="1"><line x1="81" y1="116" x2="81" y2="516"/><line x1="56" y1="141" x2="456" y2="141"/><line x1="106" y1="116" x2="106" y2="516"/><line x1="56" y1="166" x2="456" y2="166"/><line x1="131" y1="116" x2="131" y2="516"/><line x1="56" y1="191" x2="456" y2="191"/><line x1="156" y1="116" x2="156" y2="516"/><line x1="56" y1="216" x2="456" y2="216"/><line x1="181" y1="116" x2="181" y2="516"/><line x1="56" y1="241" x2="456" y2="241"/><line x1="206" y1="116" x2="206" y2="516"/><line x1="56" y1="266" x2="456" y2="266"/><line x1="231" y1="116" x2="231" y2="516"/><line x1="56" y1="291" x2="456" y2="291"/><line x1="256" y1="116" x2="256" y2="516"/><line x1="56" y1="316" x2="456" y2="316"/><line x1="281" y1="116" x2="281" y2="516"/><line x1="56" y1="341" x2="456" y2="341"/><line x1="306" y1="116" x2="306" y2="516"/><line x1="56" y1="366" x2="456" y2="366"/><line x1="331" y1="116" x2="331" y2="516"/><line x1="56" y1="391" x2="456" y2="391"/><line x1="356" y1="116" x2="356" y2="516"/><line x1="56" y1="416" x2="456" y2="416"/><line x1="381" y1="116" x2="381" y2="516"/><line x1="56" y1="441" x2="456" y2="441"/><line x1="406" y1="116" x2="406" y2="516"/><line x1="56" y1="466" x2="456" y2="466"/><line x1="431" y1="116" x2="431" y2="516"/><line x1="56" y1="491" x2="456" y2="491"/></g><text x="256" y="328" font-size="200" font-weight="800" fill="#f4f1ea" text-anchor="middle" dominant-baseline="middle">?</text><text x="256" y="560" font-size="22" font-weight="700" fill="#2b2a28" text-anchor="middle">マップ・ステージは開始後に公開</text><text x="256" y="594" font-size="18" fill="#5b5852" text-anchor="middle">Div.1 (高難度) / Div.2 の 2 ステージ</text><text x="256" y="646" font-size="17" fill="#7a776f" text-anchor="middle">hirokinagai-39.github.io/human-mapf</text><g filter="url(#sh)"><rect x="500" y="116" width="654" height="720" rx="14" fill="#f4f1ea"/></g><text x="526" y="156" font-size="20" font-weight="800" fill="#2b2a28">ルール</text><text x="526" y="186" font-size="17" fill="#3b3a37">期間内に通常通りプレイして総合スコアを競います．マップは 1 </text><text x="526" y="212" font-size="17" fill="#3b3a37">つ，ステージは Div.1 (高難度) と Div.2 があります．ステージ</text><text x="526" y="238" font-size="17" fill="#3b3a37">はコンテスト開始後に公開します．</text><text x="526" y="276" font-size="20" font-weight="800" fill="#2b2a28">開催期間</text><text x="526" y="306" font-size="22" font-weight="800" fill="#c0392b">9/11 12:00 〜 9/13 12:00</text><text x="526" y="344" font-size="20" font-weight="800" fill="#2b2a28">賞金</text><text x="526" y="374" font-size="17" fill="#3b3a37">Div.1 総合部門 1 位: Amazon ギフトカード 1000 円</text><text x="526" y="400" font-size="17" fill="#3b3a37">Div.2 総合部門 1 位: Amazon ギフトカード 1000 円</text><text x="526" y="438" font-size="20" font-weight="800" fill="#2b2a28">注意事項</text><text x="526" y="468" font-size="17" font-weight="700" fill="#3b3a37">1.</text><text x="548" y="468" font-size="17" fill="#3b3a37">ステージはコンテスト後も rated で残ります．</text><text x="526" y="498" font-size="17" font-weight="700" fill="#3b3a37">2.</text><text x="548" y="498" font-size="17" fill="#3b3a37">生成 AI，計算機 (プログラミング) の使用は禁止です．お絵描</text><text x="548" y="524" font-size="17" fill="#3b3a37">きツールとしての使用は許容されます．</text><text x="526" y="554" font-size="17" font-weight="700" fill="#3b3a37">3.</text><text x="548" y="554" font-size="17" fill="#3b3a37">9/11 8:00 時点でレーティングが青色以上の方は Div.2 の賞</text><text x="548" y="580" font-size="17" fill="#3b3a37">金受対象にはなりません．水色以下で総合部門 1 位の方が </text><text x="548" y="606" font-size="17" fill="#3b3a37">Div.2 の賞金対象となります．また，水色以下の方が Div.1 と</text><text x="548" y="632" font-size="17" fill="#3b3a37">Div.2 の両方で優勝した場合，Div.1 の優勝者とし Div.2 の</text><text x="548" y="658" font-size="17" fill="#3b3a37">賞金対象を繰り上げます．ここで言う水色以下とは現在アカウン</text><text x="548" y="684" font-size="17" fill="#3b3a37">ト未作成の方も含みます．</text><text x="526" y="714" font-size="17" font-weight="700" fill="#3b3a37">4.</text><text x="548" y="714" font-size="17" fill="#3b3a37">同率はこれまで通り提出時刻が早い人が上位になります．</text><text x="526" y="744" font-size="17" font-weight="700" fill="#3b3a37">5.</text><text x="548" y="744" font-size="17" fill="#3b3a37">賞金対象となった方は，何らかの証拠 (自分のアカウント名でロ</text><text x="548" y="770" font-size="17" fill="#3b3a37">グインしている様子など) を添付して X の DM 等でご連絡くだ</text><text x="548" y="796" font-size="17" fill="#3b3a37">さい．</text></svg>