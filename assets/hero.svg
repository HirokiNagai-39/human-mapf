  </g><text x="40" y="571" font-size="14" fill="#666">Random 10×10 — 8 agents</text><text x="600" y="240" font-size="72" font-weight="800" fill="#2b2a28" letter-spacing="0.5">Human MAPF</text><text x="600" y="290" font-size="27" font-weight="600" fill="#3b3a37">人力マルチエージェント経路計画</text><text x="600" y="324" font-size="19" fill="#666">Multi-Agent Path Finding, solved by hand</text><text x="600" y="392" font-size="20" fill="#2b2a28">全員をぶつけずにゴールへ。</text><text x="600" y="424" font-size="20" fill="#2b2a28">makespan と total distance で MAPF ソルバーに挑め。</text><text x="600" y="560" font-size="15" fill="#777">hirokinagai-39.github.io/human-mapf — ブラウザで無料 / 日本語・英語対応</text></svg>
